# Every 6 hours, checks that production still refreshes its meta. A failed scheduled run makes
# GitHub email the repo owner, so a crawler that quietly stopped (new server IP, broken API key) gets noticed.
name: Meta freshness

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: Fail when the last refresh is older than this many hours
        default: '12'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the last meta refresh
        env:
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '12' }}
        run: python3 .github/scripts/check-meta-freshness.py https://royaledecklab.com/api/meta/status "$MAX_AGE_HOURS"
