version: 2
updates:
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: daily
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: nuget
    directories:
      - /src/RoyaleDeckLab.Api
      - /src/RoyaleDeckLab.Api.Tests
    schedule:
      interval: daily
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
